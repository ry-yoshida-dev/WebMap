name: Release

# Pushing a tag such as v0.1.0 attaches npm tarballs of the packages to a GitHub Release, so apps can depend on them
# by URL: the packages are not on the npm registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Check that the packages carry the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const version = process.env.TAG.replace(/^v/, "");
            for (const name of ["core", "restricted-basemaps", "web"]) {
              const manifest = JSON.parse(readFileSync(`packages/${name}/package.json`, "utf8"));
              if (manifest.version !== version) throw new Error(`${manifest.name} is ${manifest.version}, not ${version}`);
              const core = manifest.dependencies?.["@web-map/core"];
              if (core !== undefined && core !== version) throw new Error(`${manifest.name} needs @web-map/core ${core}, not ${version}`);
            }
          '
      - name: Pack the packages
        run: mkdir release && npm pack --workspace packages/core --workspace packages/restricted-basemaps --workspace packages/web --pack-destination release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.tgz --title "$TAG" --generate-notes
